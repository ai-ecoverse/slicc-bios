<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
    (() => {
      const params = new URLSearchParams(location.hash.slice(1));
      const ignored = ['proxy', 'key'].filter((name) => params.has(name));
      for (const name of ignored) params.delete(name);
      const names = ['slicc-pair', 'tailscale'];
      if (params.has('tailscale')) names.push('exit');
      const taken = names.filter((name) => params.has(name));
      if (!taken.length) {
        if (ignored.length) {
          const rest = params.toString();
          history.replaceState(
            history.state,
            '',
            `${location.pathname}${location.search}${rest ? `#${rest}` : ''}`
          );
        }
        return;
      }
      const values = {};
      for (const name of taken) {
        values[name] = params.get(name);
        params.delete(name);
      }
      try {
        const id = params.get('handoff') || crypto.randomUUID();
        const key = `slicc-os.handoff.${id}`;
        const kept = JSON.parse(localStorage.getItem(key) || '{}').values || {};
        localStorage.setItem(
          key,
          JSON.stringify({ at: Date.now(), values: { ...kept, ...values } })
        );
        params.set('handoff', id);
      } catch {
        params.delete('handoff');
        const labels = {
          tailscale: 'Tailscale',
          'slicc-pair': 'pairing',
        };
        const lost = new Set([
          ...(globalThis.sliccDropped || []),
          ...taken.map((name) => labels[name]),
        ]);
        globalThis.sliccDropped = ['Tailscale', 'pairing'].filter((label) => lost.has(label));
      }
      const rest = params.toString();
      history.replaceState(
        history.state,
        '',
        `${location.pathname}${location.search}${rest ? `#${rest}` : ''}`
      );
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8f8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1b">
    <link rel="manifest" href="manifest.json">
    <title>SLICC BIOS</title>
    <style>
    @view-transition {
      navigation: auto;
    }
    </style>
    <link rel="stylesheet" href="bios.css">
    <link rel="modulepreload" href="sw/splash.js">
    <script type="module" src="bios.js"></script>
  </head>
  <body>
    <canvas class="ambient" aria-hidden="true"></canvas>
    <main class="splash" data-state="booting" data-scene="static" aria-labelledby="brand">
      <canvas class="scene" aria-hidden="true"></canvas>
      <div class="scrim"></div>
      <header class="mast">
        <h1 class="brand" id="brand">
          <img class="mark" src="icons/icon-192.png" alt="">
          <span class="wordmark">SLICC</span>
        </h1>
        <p class="kicker">The agentic operating system in your browser</p>
      </header>
      <section class="story" aria-roledescription="carousel" aria-label="About seven">
        <div class="slide">
          <p class="headline"></p>
          <p class="body"></p>
        </div>
        <div class="dots" role="tablist" aria-label="Choose a message"></div>
      </section>
      <footer class="status">
        <div class="line">
          <span class="verb" role="status" aria-live="polite">Starting</span>
          <span class="detail"></span>
          <span class="actions">
            <button class="chip primary retry" type="button" hidden>Try again</button>
            <button
              class="chip details"
              type="button"
              aria-expanded="false"
              aria-controls="diagnostics"
            >
              Details<kbd>D</kbd>
            </button>
          </span>
        </div>
        <progress max="6" value="0"></progress>
        <div class="bar" aria-hidden="true">
          <span data-segment="opfs"></span>
          <span data-segment="installer"></span>
          <span data-segment="packages"></span>
          <span data-segment="seed"></span>
          <span data-segment="intercept"></span>
          <span data-segment="navigate"></span>
        </div>
        <p class="credits"></p>
      </footer>
      <dialog class="six" closedby="none" aria-labelledby="six-title" aria-describedby="six-body">
        <h2 class="six-title" id="six-title"></h2>
        <p class="six-body" id="six-body"></p>
        <p class="six-progress" role="status" aria-live="polite" hidden></p>
        <progress class="six-bar" aria-labelledby="six-title" hidden></progress>
        <div class="six-actions">
          <button class="chip primary six-move" type="button"></button>
          <button class="chip six-later" type="button">Not now</button>
        </div>
      </dialog>
      <aside class="diagnostics" id="diagnostics" aria-label="Diagnostics" inert>
        <header>
          <h2>Diagnostics</h2>
          <button class="close" type="button" aria-label="Close diagnostics">×</button>
        </header>
        <dl class="env"></dl>
        <ol class="steps">
          <li data-step="opfs">Acquire OPFS <output></output></li>
          <li data-step="installer">Create installer worker <output></output></li>
          <li data-step="packages">Install packages from npm into OPFS <output></output></li>
          <li data-step="seed">Add UI page to OPFS <output></output></li>
          <li data-step="intercept">Intercept same-origin requests <output></output></li>
          <li data-step="navigate">Serve UI from OPFS <output></output></li>
        </ol>
        <ol class="log" aria-label="Boot log"></ol>
        <footer>
          <button class="chip copy" type="button">Copy diagnostics</button>
          <button class="chip primary retry" type="button" hidden>Try again</button>
        </footer>
      </aside>
    </main>
  </body>
</html>
