<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SLICC</title>
    <style>
    @view-transition {
      navigation: auto;
    }
    </style>
    <link rel="stylesheet" href="os.css">
    <script type="module" src="os.js"></script>
  </head>
  <body>
    <slicc-app>
      <span slot="status" class="network" aria-live="polite" hidden>
        <output></output><button type="button">Retry</button>
      </span>
      <span slot="status" class="update" aria-live="polite" hidden>
        <output></output><button type="button">Reload</button>
      </span>
    </slicc-app>
  </body>
</html>
