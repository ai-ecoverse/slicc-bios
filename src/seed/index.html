<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SLICC</title>
    <style>
    @view-transition {
      navigation: auto;
    }
    </style>
    <link rel="stylesheet" href="os.css">
    <script type="module" src="os.js"></script>
  </head>
  <body>
    <slicc-app>
      <span slot="status" class="tailscale" aria-live="polite" hidden>
        <output></output><a target="_blank" rel="noopener" hidden>Sign in</a>
        <form hidden>
          <input
            type="password"
            autocomplete="off"
            aria-label="Tailscale auth key"
            placeholder="tskey-auth-…"
          ><button type="submit">Join</button>
        </form>
      </span>
    </slicc-app>
  </body>
</html>
