name: Claude review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: number

permissions:
  contents: read

jobs:
  review:
    name: claude / review
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.label.name == 'claude-review' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: The pull request's head and base, refused when the head is on a fork
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r repo head base <<< "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.head.repo.full_name) \(.head.sha) \(.base.ref)"')"
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::#$PR_NUMBER's head is on $repo, and fork code is never reviewed here"
            exit 1
          fi
          echo "#$PR_NUMBER: head $head, base $base"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
        with:
          use_bedrock: 'true'
          github_token: ${{ github.token }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          classify_inline_comments: 'false'
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,Read,Grep,Glob"
            --max-turns 150
          prompt: |
            You are the code reviewer for slicc-bios, the loader that installs seven (seven.sliccy.ai) into the browser: a WebAssembly kernel, its shell and packages, the agent, and the page around them. Review pull request ${{ env.PR_NUMBER }} of ${{ github.repository }}: head ${{ steps.pr.outputs.head }}, base `${{ steps.pr.outputs.base }}`.

            WHAT'S SET UP
            - The head is checked out in the working directory with full history; the base is `origin/${{ steps.pr.outputs.base }}`, so `git diff origin/${{ steps.pr.outputs.base }}...HEAD` is the change.
            - `gh` is on `PATH` with a token that reads the repository and writes pull request comments: `gh pr view ${{ env.PR_NUMBER }}`, `gh pr diff ${{ env.PR_NUMBER }}`, `gh api`.
            - You may run code to confirm a finding (`npm ci`, then a script or a `node -e`). Don't run the integration suite: CI runs it on every push.

            WHAT TO LOOK FOR
            1. Correctness: logic errors, races, missed error paths, edge cases, state that a reload, a reconnect or a second tab breaks, and anything that would break seven for the people using it.
            2. Security, above all:
               - the guard (`src/seed/guard.js`) and the CDP surface (`src/seed/cdp.js`, the in-kernel 9222 facade): nothing new a page, a kernel program or a linked device can reach, and no protected origin exposed;
               - the vault and `/dev/sealed` (`src/seed/vault.js`): no sealed value reaching the page, a log, a URL or a program that didn't ask, and no request that can run twice;
               - secrets and tokens anywhere: never logged, printed or put in a URL;
               - sudo and approvals (`src/seed/approvals.js`, `src/seed/users.js`): no path to root without the owner's decision, and no decision applied to the wrong request or user;
               - the link, follower, remote and tray surfaces, and the service worker's integrity checks (`src/sw/`);
               - workflows: fork code never reaches a self-hosted or Cloud Run runner, a secret is given only to the step that needs it, actions are pinned to a commit sha, and `id-token: write` appears only on hosted publish jobs.
            3. bios's rules:
               - Lockfiles (`package-lock.json`, `src/packages/package-lock.json`, `src/packages/pnpm-lock.yaml`) are regenerated, never hand-edited: flag a lockfile change that the package.json changes don't explain, and a package.json change whose lockfile didn't follow.
               - Every pinned gated package (slicc-kernel, slicc-jsh, slicc-cdp, slicc-clipboard, pnpm, wasm-*, wasi-*, wasix-*, py-*) has its line in `src/packages/certs.json`.
               - A bug fix comes with a committed integration test under `test/integration/` that would have caught it. Tests check behaviour through the public surface (seven's page, the terminal's commands, the kernel API, the CLI), not the implementation: no mocks of internals, and no assertions on private functions or call order. Unit tests stay out of git, so any file under `test/unit/` is a finding.
               - No blind waits in tests: every wait is bounded, waits for one specific precondition, and fails with what it waited for and what it saw. Flag sleeps, fixed timeouts that wait out a symptom, and waits whose failure says only that it timed out.
               - No comments in code, YAML, HTML, CSS or `.gitignore`, and no Markdown file other than README.md.

            HOW TO REPORT
            - One inline comment per finding, on the changed line it's about. Start each with **P1** (must be fixed before merging: a bug users will hit, a security hole, data loss, or a broken rule) or **P2** (should be fixed: a real bug in an edge case, a missing test, a blind wait), then a one-line statement of the problem, why it matters, and the fix.
            - No style nits, no praise, and nothing speculative: read the code, or run it, until you're sure. No comment is better than a wrong one.
            - Post inline comments with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true` if you have that tool. If you don't, post them all as one review: write `{"commit_id": "${{ steps.pr.outputs.head }}", "event": "COMMENT", "body": "<summary>", "comments": [{"path": "...", "line": <line in the head>, "side": "RIGHT", "body": "..."}]}` to a file and run `gh api --method POST repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews --input <file>`.
            - Finish with a summary of a few sentences: what the change does, what you checked, and the findings by severity, or "No P1 or P2 findings". It goes in your tracking comment if you have one, or else in the review's body.
            - Never approve or request changes, and don't edit, commit or push anything.
