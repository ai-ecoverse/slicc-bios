name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release / npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only the newest main is released
        id: head
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "release: SKIPPED main has moved past $(git rev-parse --short HEAD); the run for the newer commit releases it" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm 11.5.1 or newer, for trusted publishing
        if: steps.head.outputs.current == 'true'
        run: npm install -g npm@11.21.0

      - if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tag and write the GitHub release
        id: release
        if: steps.head.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee "$RUNNER_TEMP/release.log"
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          node scripts/ci/verdict.mjs release --log "$RUNNER_TEMP/release.log" --tag "$tag"

      - name: Publish the tag to npm with provenance, unless npm already has it, and wait until npm serves the packed tarball
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/ci/publish.sh
