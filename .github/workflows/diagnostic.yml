name: Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/diagnostic.yml
      - test/integration/guard-diagnostic-675.test.mjs

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SLICC_CDP_PORTS: 9300-9309
      SLICC_PROOF_TRACE_DIR: ${{ runner.temp }}/diagnostic-trace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx --no-install slicc-cdp install-browser
      - name: Run diagnostic
        run: |
          set +e
          node --test --test-concurrency=1 --test-timeout=900000 --test-global-setup=test/integration/global.mjs test/integration/guard-diagnostic-675.test.mjs > "$RUNNER_TEMP/diagnostic.log" 2>&1
          result=$?
          echo "Diagnostic exit: $result"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-trace
          path: ${{ runner.temp }}/diagnostic-trace/*.json
          if-no-files-found: error
          retention-days: 3
