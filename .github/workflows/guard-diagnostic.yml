name: Guard Diagnostic

on:
  push:
    branches: [bb/diagnostic-1024-1f2d42eb]

permissions:
  contents: read

concurrency:
  group: guard-diagnostic-1024-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: cloud-run-job
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shared-proxy-rest
            file: test/integration/guard-set-proxy-rest.test.mjs
            pattern: the shared guard vectors
            ids: C3.popup-self-nav,C3.popup-on-redirect-302,C8.newtab,C8.iframe-error
            targets: own,chrome-newtab,chrome-new-tab-page,network-error
            variants: prompt,lagging
          - group: shared-link-rest
            file: test/integration/guard-set-link-rest.test.mjs
            pattern: the shared guard vectors
            ids: C3.popup-self-nav,C3.popup-on-redirect-302,C8.newtab,C8.iframe-error
            targets: own,chrome-newtab,chrome-new-tab-page,network-error
            variants: prompt,lagging
          - group: shared-proxy-apex
            file: test/integration/guard-set-proxy-apex-lagging.test.mjs
            pattern: the shared guard vectors
            ids: C3.popup-on-redirect-302
            targets: apex
            variants: lagging
          - group: opaque-srcdoc-editors
            file: test/integration/guard-frames.test.mjs
            pattern: ordinary page.*about:blank.*srcdoc editors
          - group: cdp-attachments-and-driving
            file: test/integration/cdp.test.mjs
            pattern: real slicc-extension.*opaque origin|guard keeps seven|directory it cannot write|guard setup step.*12 s
          - group: sign-in-noopener
            file: test/integration/sign-in-held.test.mjs
            pattern: sign-in tabs and their lineage
          - group: redirect-observers
            file: test/integration/guard-redirect.test.mjs
            pattern: redirect to seven or the vault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: slicc-harness-cdn-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: slicc-harness-cdn-${{ runner.os }}-
      - name: Browser and display
        run: |
          node_modules/.bin/slicc-cdp install-browser
          if ! command -v xvfb-run > /dev/null; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb;
            else sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; fi
          fi
      - name: One diagnostic attempt
        env:
          SLICC_GUARD_DIAGNOSTIC_FILE: ${{ matrix.file }}
          SLICC_GUARD_DIAGNOSTIC_PATTERN: ${{ matrix.pattern }}
          GUARD_IDS: ${{ matrix.ids }}
          GUARD_TARGETS: ${{ matrix.targets }}
          GUARD_VARIANTS: ${{ matrix.variants }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' node test/integration/guard-diagnostic-run.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: guard-diagnostic-${{ matrix.group }}
          path: guard-diagnostics/
          if-no-files-found: error
          retention-days: 3
