name: Canary issue

on:
  workflow_run:
    workflows: [Canary]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  file:
    name: canary / known issue
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: canary
          path: canary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: canary-inputs
          path: inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: File or update the known issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node scripts/canary/issue.mjs --dir canary --inputs inputs/canary-inputs.json
