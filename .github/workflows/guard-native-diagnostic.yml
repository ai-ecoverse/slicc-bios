name: Guard Native Diagnostic

on:
  push:
    branches: [fix/minimal-guard-ordering-thr_yd6wq3u9mx]
    paths: [.github/workflows/guard-native-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: guard-native-diagnostic-1061-once
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: cloud-run-job
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: slicc-harness-cdn-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: slicc-harness-cdn-${{ runner.os }}-
      - name: Browser and display
        run: |
          node_modules/.bin/slicc-cdp install-browser
          if ! command -v xvfb-run > /dev/null; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb;
            else sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; fi
          fi
      - name: Single metadata diagnostic
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' node test/integration/guard-native-diagnostic-run.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: guard-native-diagnostic
          path: guard-diagnostic/
          if-no-files-found: error
          retention-days: 3
