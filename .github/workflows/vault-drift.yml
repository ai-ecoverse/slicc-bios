name: vault drift

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: vault-drift
  cancel-in-progress: true

jobs:
  vault-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare live vault-preview to the root pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PIN=$(node -p "require('./package.json').devDependencies['@ai-ecoverse/slicc-vault']")
          LIVE=$(curl -fsS https://vault-preview.sliccy.ai/config.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          if [ "$LIVE" = "$PIN" ]; then
            echo "vault-preview $LIVE matches pin $PIN"
            exit 0
          fi
          TITLE="vault drift: live $LIVE, pinned $PIN"
          echo "::error::$TITLE"
          EXISTING=$(gh issue list --state open --search "in:title \"vault drift:\"" --json number,title --jq '[.[] | select(.title | startswith("vault drift:"))] | .[0].number // empty')
          BODY=$(printf 'Live https://vault-preview.sliccy.ai/config.json reports `%s` while the root `@ai-ecoverse/slicc-vault` pin is `%s`.\n\nBump the root pin (and lockfile) to `%s`, or investigate an unexpected preview deploy.\n' "$LIVE" "$PIN" "$LIVE")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            gh issue comment "$EXISTING" --body "Still drifting: live \`$LIVE\`, pinned \`$PIN\`."
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1
