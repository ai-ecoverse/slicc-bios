name: cert-review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cert-review-approved') || (github.event.action == 'edited' && !github.event.changes.base)) && format('cert-review-noop-{0}', github.run_id) || format('cert-review-{0}-{1}', github.event_name == 'pull_request' && 'leg' || 'pr', github.event.pull_request.number || github.event.merge_group.head_sha) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  cert:
    name: cert
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/cert-review.yml@d6905ade35cae4418fde21cb7d947cad7ea96b1d
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      issues: write
      pull-requests: write
    with:
      tools-ref: d6905ade35cae4418fde21cb7d947cad7ea96b1d
      rules: scripts/cert/review.txt
      loud: |
        src/**
        edge/**
      guard-paths: |
        .github/workflows/**
        .github/actions/**
        scripts/cert/**
        scripts/ci/**
        test/integration/cert.test.mjs
      injection-allow: |
        test/integration/fixtures/**
      evidence-workflow: ci.yml
      evidence-artifacts: |
        cert-evidence
        cert-inspect
        integration-*
        experiment-summary
      evidence-wait-minutes: 180
      evidence-notes: |
        cert-inspect/inspect/**
      code-check: node scripts/cert/release-state.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
    secrets:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
