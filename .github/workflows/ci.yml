name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: cloud-run-job
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: slicc-harness-cdn-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: slicc-harness-cdn-${{ runner.os }}-
      - name: Chrome
        run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps} --version 156.0.8078.80
      - name: Original shard
        env:
          SLICC_RECOVERY_TRACE: "1"
          TEST: npm test
          GLOB: test/integration/*.test.mjs
          SHARDS: "14"
          SLICC_TEST_SHARD: "4"
          SLICC_TEST_FILES: |
            test/integration/cdp.test.mjs
            test/integration/update.test.mjs
            test/integration/guard-signin.test.mjs
            test/integration/agent-downgrade.test.mjs
            test/integration/guard-redirect.test.mjs
            test/integration/guard-paint-extension.test.mjs
            test/integration/follow-leaders.test.mjs
            test/integration/gpg.test.mjs
            test/integration/shots-pointer.test.mjs
            test/integration/guard-state-liveness.test.mjs
            test/integration/guard-restored-boundary.test.mjs
            test/integration/guard-state-admission.test.mjs
            test/integration/guard-state-close-scrub.test.mjs
            test/integration/guard-lock-lifecycle.test.mjs
            test/integration/releases-boundary.test.mjs
            test/integration/guard-state-input-settlement.test.mjs
            test/integration/guard-state-witness-race.test.mjs
            test/integration/guard-state-extension.test.mjs
        run: |
          mkdir -p diagnostic junit
          node -e 'const os=require("node:os"); console.log(JSON.stringify({at:Date.now(),cores:os.availableParallelism(),load:os.loadavg(),memory:os.totalmem(),shards:process.env.SHARDS,glob:process.env.GLOB,test:process.env.TEST}))' > diagnostic/runner.json
          sha256sum node_modules/@ai-ecoverse/slicc-cdp/bin/playwright-cli.wasm > diagnostic/released-wasm.sha256
          SLICC_TEST_ALL="$(node -e 'for(const file of require("node:fs").globSync(process.env.GLOB)) console.log(file)')"
          export SLICC_TEST_ALL
          export SLICC_TEST_JUNIT="$PWD/junit/4.xml"
          export SLICC_TEST_DOWNLOADS="$PWD/junit/4.downloads"
          export SLICC_TEST_NODE_OPTIONS=""
          export NODE_OPTIONS="--require $PWD/node_modules/@ai-ecoverse/slicc-shared-web/harness/shard.cjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=$PWD/junit/4.xml"
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' bash -eo pipefail -c "$TEST" 2>&1 | tee diagnostic/shard.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-${{ github.run_attempt }}
          path: |
            diagnostic/
            junit/
            artifacts/**/*.log
          if-no-files-found: error
