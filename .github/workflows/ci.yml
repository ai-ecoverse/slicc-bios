name: Diagnostic only

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: cloud-run-job
    timeout-minutes: 60
    env:
      CI: 'true'
      SLICC_CDP_PORTS: 9300-9309
      SLICC_HEADLESS: '0'
      SLICC_RECOVERY_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps}
      - name: Display
        run: |
          if ! command -v Xvfb > /dev/null; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb
            else sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; fi
          fi
      - name: Bounded rows
        run: |
          mkdir -p diagnostic
          node -e 'const os=require("node:os"); console.log(JSON.stringify({at:Date.now(),cores:os.availableParallelism(),load:os.loadavg(),memory:os.totalmem()}))' > diagnostic/runner.json
          pattern='^(playwright-cli drives a page|over the extension|real slicc-extension .*: unsupported|real slicc-extension .*: recovery scenario)'
          for pass in 1 2 3; do
            rm -rf node_modules/.cache/slicc-extension-7.10.0
            result=0
            xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' timeout -k 30 900 node --test --test-concurrency=1 --test-timeout=900000 --test-name-pattern="$pattern" --test-global-setup=test/integration/global.mjs --test-reporter=spec --test-reporter-destination="diagnostic/$pass.log" --test-reporter=junit --test-reporter-destination="diagnostic/$pass.xml" test/integration/cdp.test.mjs || result=$?
            node test/integration/recovery-evidence.mjs "$pass"
            if [ "$result" != 0 ]; then exit "$result"; fi
          done
      - name: Text evidence
        if: always()
        run: |
          mkdir -p diagnostic
          node -e 'const fs=require("node:fs"); for(const name of fs.readdirSync("diagnostic").filter(n=>n.endsWith(".summary.json"))) console.log(name,fs.readFileSync("diagnostic/"+name,"utf8"))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-text
          path: |
            diagnostic/*.json
            diagnostic/*.jsonl
          retention-days: 3
