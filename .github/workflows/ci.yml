name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: cloud-run-job
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel: ['1.170.1', '1.170.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: slicc-harness-cdn-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: slicc-harness-cdn-${{ runner.os }}-
      - name: Chrome
        run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps} --version 156.0.8078.80
      - name: Kernel arm
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          if [ "$KERNEL" = 1.170.1 ]; then
            cp test/integration/recovery-kernel-1.170.1/package.json src/packages/package.json
            cp test/integration/recovery-kernel-1.170.1/package-lock.json src/packages/package-lock.json
            cp test/integration/recovery-kernel-1.170.1/pnpm-lock.yaml src/packages/pnpm-lock.yaml
          fi
          node -e 'const m=require("./src/packages/package.json"); if(m.dependencies["@ai-ecoverse/slicc-kernel"]!==process.env.KERNEL) throw new Error("wrong kernel arm")'
      - name: Original shard
        env:
          SLICC_RECOVERY_TRACE: "1"
          SLICC_RECOVERY_KERNEL: ${{ matrix.kernel }}
          TEST: npm test
          GLOB: test/integration/*.test.mjs
          SHARDS: "14"
          SLICC_TEST_SHARD: "4"
          SLICC_TEST_FILES: |
            test/integration/cdp.test.mjs
            test/integration/update.test.mjs
            test/integration/old-agent.test.mjs
            test/integration/favicon.test.mjs
            test/integration/lost-folder.test.mjs
            test/integration/releases.test.mjs
            test/integration/guard-paint-link.test.mjs
            test/integration/mcpcat.test.mjs
            test/integration/guard-autoattach.test.mjs
            test/integration/guard-ordering-loading-ordinary.test.mjs
            test/integration/guard-state-no-discovery.test.mjs
            test/integration/guard-ordering.test.mjs
            test/integration/guard-state-policy.test.mjs
            test/integration/guard-state-history.test.mjs
            test/integration/guard-state-close-races.test.mjs
            test/integration/guard-state-rendering.test.mjs
            test/integration/guard-state-pending-attach-exit.test.mjs
            test/integration/guard-state-descendants.test.mjs
        run: |
          mkdir -p diagnostic junit
          node -e 'const os=require("node:os"); console.log(JSON.stringify({at:Date.now(),cores:os.availableParallelism(),load:os.loadavg(),memory:os.totalmem(),shards:process.env.SHARDS,glob:process.env.GLOB,test:process.env.TEST,kernel:process.env.SLICC_RECOVERY_KERNEL}))' > diagnostic/runner.json
          sha256sum node_modules/@ai-ecoverse/slicc-cdp/bin/playwright-cli.wasm > diagnostic/released-wasm.sha256
          SLICC_TEST_ALL="$(node -e 'for(const file of require("node:fs").globSync(process.env.GLOB)) console.log(file)')"
          export SLICC_TEST_ALL
          export SLICC_TEST_JUNIT="$PWD/junit/4.xml"
          export SLICC_TEST_DOWNLOADS="$PWD/junit/4.downloads"
          export SLICC_TEST_NODE_OPTIONS=""
          export NODE_OPTIONS="--require $PWD/node_modules/@ai-ecoverse/slicc-shared-web/harness/shard.cjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=$PWD/junit/4.xml"
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' bash -eo pipefail -c "$TEST" 2>&1 | tee diagnostic/shard.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-${{ matrix.kernel }}-${{ github.run_attempt }}
          path: |
            diagnostic/
            junit/
            artifacts/**/*.log
          if-no-files-found: error
