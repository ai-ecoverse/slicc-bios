name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARDED: '/(follow[^/]*|chat|remote|pydata|updates|users|agent-ui|packages|update|cdp|guard-vectors|guard-set-[a-z]+|serve|k4[^/]*|link|user-packages|keys|favicon)\.test\.mjs$'

jobs:
  lint:
    name: ci / lint
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  integration:
    name: ci / integration (${{ matrix.shard }})
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: follow-chat
            match: '/(follow[^/]*|chat)\.test\.mjs$'
          - shard: remote-pydata
            match: '/(remote|pydata|updates)\.test\.mjs$'
          - shard: users-agent-ui
            match: '/(users|agent-ui)\.test\.mjs$'
          - shard: packages-update-cdp
            match: '/(packages|update|cdp)\.test\.mjs$'
          - shard: guard
            match: '/(guard-vectors|serve)\.test\.mjs$'
          - shard: guard-set-extension-prompt
            match: '/guard-set-extension\.test\.mjs$'
            variants: prompt
          - shard: guard-set-extension-lagging
            match: '/guard-set-extension\.test\.mjs$'
            variants: lagging
          - shard: guard-set-proxy-prompt
            match: '/guard-set-proxy\.test\.mjs$'
            variants: prompt
          - shard: guard-set-proxy-lagging
            match: '/guard-set-proxy\.test\.mjs$'
            variants: lagging
          - shard: k4-link
            match: '/(k4[^/]*|link)\.test\.mjs$'
          - shard: user-packages-keys-favicon
            match: '/(user-packages|keys|favicon)\.test\.mjs$'
          - shard: rest
            match: ''
    env:
      LEFTHOOK: '0'
      SLICC_NO_UPDATE_CHECK: '1'
      SLICC_CLI: ${{ github.workspace }}/node_modules/.bin/slicc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Harness download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-

      - name: Chromium system dependencies
        run: |
          if sudo -n true 2>/dev/null; then
            npx playwright-core install-deps chromium
          else
            echo "No root on $RUNNER_NAME: the image's system libraries and fonts serve Chromium."
          fi

      - name: Integration tests with coverage, CPU profiles, and screenshots
        env:
          MATCH: ${{ matrix.match }}
          GUARD_VARIANTS: ${{ matrix.variants }}
        run: |
          all=$(ls test/integration/*.test.mjs)
          if [ -n "$MATCH" ]; then files=$(printf '%s\n' "$all" | grep -E "$MATCH" || true)
          else files=$(printf '%s\n' "$all" | grep -vE "$SHARDED" || true); fi
          if [ -z "$files" ]; then echo "no test files in shard ${{ matrix.shard }}" >&2; exit 1; fi
          printf 'shard ${{ matrix.shard }}:\n%s\n' "$files"
          printf '%s\n' "$files" > "$RUNNER_TEMP/files.txt"
          set -o pipefail
          SLICC_TESTS="$(printf '%s\n' "$files" | tr '\n' ' ')" npm test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: The shard's verdict, from the test summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/verdict.mjs shard --name "$SHARD" --log "$RUNNER_TEMP/test.log" --files "$(cat "$RUNNER_TEMP/files.txt" 2>/dev/null)" --out "artifacts/verdicts/$SHARD.txt"

      - name: Crash dumps
        if: always()
        run: |
          find artifacts -name '*.dmp' 2>/dev/null | while read -r dump; do
            report="${dump%.dmp}.txt"
            node node_modules/.bin/slicc-minidump "$dump" > "$report" 2>&1 || true
            {
              printf '### Crash dump %s\n\n~~~\n' "$dump"
              sed -n '1,/^modules:$/p' "$report" | head -100
              printf '~~~\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            artifacts/
            node_modules/.cache/slicc-harness/coverage/
            node_modules/.cache/slicc-harness/hotspots/
          if-no-files-found: ignore

  ci:
    name: ci / test
    needs: [lint, integration]
    if: always()
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: integration-*
          merge-multiple: true
          path: .

      - name: Coverage and hotspots across the shards
        run: |
          rm -rf artifacts/hotspots.md coverage
          node --input-type=module -e "
            const { pathToFileURL } = await import('node:url');
            const harness = await import(pathToFileURL('node_modules/@ai-ecoverse/slicc-shared-web/harness/global.mjs'));
            await harness.report();
            await harness.hotspots();
          "
          cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore

      - name: Every shard and lint passed, each with its verdict
        if: always()
        env:
          LINT: ${{ needs.lint.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: node scripts/ci/verdict.mjs shards --dir artifacts/verdicts --workflow .github/workflows/ci.yml --results "{\"lint\":\"$LINT\",\"integration\":\"$INTEGRATION\"}"
