name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: The Renovate pull request whose head this run checks, as cert review's queue job dispatches it
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLICC_CDP_PORTS: '9300-9309'

jobs:
  plan:
    name: ci / plan
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      arm: ${{ steps.plan.outputs.arm }}
      pr: ${{ steps.plan.outputs.pr }}
      failfast: ${{ steps.plan.outputs.failfast }}
      retry: ${{ steps.plan.outputs.retry }}
      seed: ${{ steps.plan.outputs.seed }}
      mode: ${{ steps.plan.outputs.mode }}
      vendors: ${{ steps.plan.outputs.vendors }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - name: The changed files' mode, the experiment's arm and a random, duration-balanced shard assignment
        id: plan
        run: node scripts/ci/plan.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experiment-plan
          path: artifacts/experiment/plan.json

  lint:
    name: ci / lint
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  integration:
    name: ci / integration (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.shards != ''
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: ${{ needs.plan.outputs.failfast == 'true' }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LEFTHOOK: '0'
      SLICC_NO_UPDATE_CHECK: '1'
      SLICC_CLI: ${{ github.workspace }}/node_modules/.bin/slicc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Harness download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-

      - name: Chromium system dependencies
        run: |
          if sudo -n true 2>/dev/null; then
            npx playwright-core install-deps chromium
          else
            echo "No root on $RUNNER_NAME: the image's system libraries and fonts serve Chromium."
          fi

      - run: npm run pretest

      - name: Integration tests with screenshots, and the shard's verdict
        env:
          SHARD: ${{ matrix.shard }}
          ITEMS: ${{ matrix.items }}
          RETRY: ${{ needs.plan.outputs.retry }}
          EXPERIMENT_ARM: ${{ needs.plan.outputs.arm }}
          EXPERIMENT_PR: ${{ needs.plan.outputs.pr }}
          EXPERIMENT_SEED: ${{ needs.plan.outputs.seed }}
        run: node scripts/ci/shard.mjs --name "$SHARD" --items "$ITEMS" --retry "$RETRY"

      - name: Crash dumps
        if: always()
        run: |
          find artifacts -name '*.dmp' 2>/dev/null | while read -r dump; do
            report="${dump%.dmp}.txt"
            node node_modules/.bin/slicc-minidump "$dump" > "$report" 2>&1 || true
            {
              printf '### Crash dump %s\n\n~~~\n' "$dump"
              sed -n '1,/^modules:$/p' "$report" | head -100
              printf '~~~\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Screenshots and traces only for suites that failed (each dropped file is listed in artifacts/pruned.json)
        if: always()
        run: node scripts/ci/prune.mjs artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            artifacts/
            node_modules/.cache/slicc-harness/hotspots/
          if-no-files-found: ignore

  vendors:
    name: ci / vendors
    needs: plan
    if: needs.plan.outputs.vendors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
      SLICC_NO_UPDATE_CHECK: '1'
      SLICC_CLI: ${{ github.workspace }}/node_modules/.bin/slicc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Firefox and WebKit, with their system libraries
        run: npx playwright-core install --with-deps firefox webkit

      - name: Pairing in Firefox and WebKit through the real slicc pair, and the verdict
        run: |
          node --test --test-concurrency=1 --test-timeout=600000 test/integration/vendors/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/vendors.log" || true
          node scripts/ci/verdict.mjs shard --name vendors --log "$RUNNER_TEMP/vendors.log"

  inspect:
    name: ci / cert inspect
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LEFTHOOK: '0'
    steps:
      - name: Main's tree runs; the pull request's head is only data (its manifests and lockfiles)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - name: Each changed pin's registry tarball, provenance and diff, and the release state of the gated ones, all from main's scripts (no pull-request code runs here)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/cert-inspect"
          (cd base && npm ci --ignore-scripts --no-audit --no-fund)
          node base/scripts/cert/evidence.mjs plan --head head --base base --shards none --out "$out"
          node base/scripts/cert/evidence.mjs inspect --head head --base base --out "$out"
          git -C base fetch -q --no-tags origin "$HEAD_SHA"
          base_sha=$(git -C base merge-base HEAD "$HEAD_SHA")
          (cd base && node scripts/cert/release-state.mjs --base "$base_sha" --head "$HEAD_SHA" --out "$out/release-state.json" --no-fail)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-inspect
          path: ${{ runner.temp }}/cert-inspect/
          if-no-files-found: error

  evidence:
    name: ci / cert evidence
    needs: [plan, integration]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    env:
      LEFTHOOK: '0'
      SLICC_NO_TELEMETRY: '1'
      SLICC_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: integration-*
          path: ${{ runner.temp }}/shards

      - id: plan
        name: The pins this PR changes, the test files its shards failed, and the gated pins' scenarios
        env:
          GH_TOKEN: ${{ github.token }}
        run: node head/scripts/cert/evidence.mjs plan --head head --base base --shards "$RUNNER_TEMP/shards" --out "$RUNNER_TEMP/cert-evidence" --budget-min 20

      - name: Install both trees, and the harness's Chromium when a browser runs
        if: steps.plan.outputs.browser == 'true'
        env:
          BROWSER: ${{ steps.plan.outputs.browser }}
        run: |
          (cd base && npm ci --no-audit --no-fund)
          (cd head && npm ci --no-audit --no-fund)
          if [ "$BROWSER" = true ]; then (cd head && npx playwright-core install --no-shell chromium); fi

      - name: Each tree's slicc CLI (the released binary where a tree has none)
        if: steps.plan.outputs.browser == 'true'
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::no release for $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          for tree in base head; do
            cli="$GITHUB_WORKSPACE/$tree/node_modules/.bin/slicc"
            if [ ! -x "$cli" ]; then
              if [ ! -x "$RUNNER_TEMP/bin/slicc-release" ]; then
                release=https://github.com/ai-ecoverse/slicc-cli/releases/latest/download
                (cd "$RUNNER_TEMP/bin" && curl -fsSL -O "$release/slicc-linux-$arch" -O "$release/SHA256SUMS" && sha256sum -c SHA256SUMS --ignore-missing && mv "slicc-linux-$arch" slicc-release && chmod +x slicc-release)
              fi
              cli="$RUNNER_TEMP/bin/slicc-release"
            fi
            echo "SLICC_CLI_${tree^^}=$cli" >> "$GITHUB_ENV"
            echo "$tree: $("$cli" --version) ($cli)"
          done

      - name: Each failed test file up to three times on the head's tree (until it passes) and, if it never did, on main's, within the 20-minute budget, and each file a shard's retry flipped (a head flake); known flaky files are skipped unless they cover data integrity, security or the guard
        if: steps.plan.outputs.reruns == 'true'
        run: node head/scripts/cert/evidence.mjs reruns --head head --base base --out "$RUNNER_TEMP/cert-evidence" --times 3

      - name: Each changed gated pin's cert scenario in seven, on the head's pins and on main's
        if: steps.plan.outputs.browser == 'true'
        run: node head/scripts/cert/evidence.mjs scenarios --head head --base base --out "$RUNNER_TEMP/cert-evidence"

      - name: The evidence is complete, by main's check (it reads only JSON; the head's only while main has none); a spent budget or a missing result fails here, and so ci / test
        if: ${{ !cancelled() }}
        run: |
          if grep -q "reruns, scenarios, check }" base/scripts/cert/evidence.mjs; then t=base; else t=head; fi
          node "$t/scripts/cert/evidence.mjs" check --head head --base base --out "$RUNNER_TEMP/cert-evidence"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-evidence
          path: ${{ runner.temp }}/cert-evidence/
          if-no-files-found: error

  ci:
    name: ci / test
    needs: [plan, lint, integration, vendors, evidence]
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: integration-*
          merge-multiple: true
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: experiment-plan
          path: artifacts/experiment

      - name: Hotspots across the shards
        run: |
          rm -rf artifacts/hotspots.md
          node --input-type=module -e "
            const { pathToFileURL } = await import('node:url');
            const harness = await import(pathToFileURL('node_modules/@ai-ecoverse/slicc-shared-web/harness/global.mjs'));
            await harness.hotspots();
          "
          cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: The run's experiment summary, and a flaky-test issue for each test a retry flipped
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/summary.mjs --dir artifacts/experiment --issues

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: experiment-summary
          path: artifacts/experiment/summary.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            artifacts/
          if-no-files-found: ignore

      - name: The cert evidence finished inside its budget (skipped only off pull requests and for forks)
        if: always()
        env:
          EVIDENCE: ${{ needs.evidence.result }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          case "$EVIDENCE" in
            success) ;;
            skipped) [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$SAME_REPO" != true ] || { echo "ci / cert evidence was skipped on a same-repo pull request"; exit 1; } ;;
            *) echo "ci / cert evidence: $EVIDENCE (incomplete evidence is not a pass)"; exit 1 ;;
          esac

      - name: Every shard and lint passed, each with its verdict
        if: always()
        env:
          PLAN: ${{ needs.plan.result }}
          LINT: ${{ needs.lint.result }}
          INTEGRATION: ${{ needs.integration.result }}
          VENDORS: ${{ needs.vendors.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          MODE: ${{ needs.plan.outputs.mode }}
          SKIP: ${{ needs.plan.outputs.skip }}
        run: node scripts/ci/verdict.mjs shards --dir artifacts/verdicts --expect "$SHARDS" --results "{\"plan\":\"$PLAN\",\"lint\":\"$LINT\",\"integration\":\"$INTEGRATION\",\"vendors\":\"$VENDORS\"}" --mode "$MODE" --skip "$SKIP"

      - name: Every gated pin or certs.json line a PR or merge group changes is a release its own repository certified (release-state)
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch -q --no-tags --depth=1 origin "$BASE"
          node scripts/cert/release-state.mjs --base "$BASE" --head HEAD --out artifacts/cert/release-state.json
