name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Harness download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-

      - name: Lint
        run: npm run lint

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache: false

      - name: The slicc CLI, the link's reference peer
        env:
          SLICC_CLI_COMMIT: 567b608383e372994e685d6513365459df16a655
        run: |
          GOBIN="$RUNNER_TEMP/slicc-cli" go install "github.com/ai-ecoverse/slicc-cli/cmd/slicc@$SLICC_CLI_COMMIT"
          echo "SLICC_CLI=$RUNNER_TEMP/slicc-cli/slicc" >> "$GITHUB_ENV"

      - name: Chromium system dependencies
        run: npx playwright-core install-deps chromium

      - name: Integration tests with coverage, CPU profiles, and screenshots
        run: npm test

      - name: Hotspots
        if: always()
        run: cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Crash dumps
        if: always()
        run: |
          find artifacts -name '*.dmp' 2>/dev/null | while read -r dump; do
            report="${dump%.dmp}.txt"
            node node_modules/.bin/slicc-minidump "$dump" > "$report" 2>&1 || true
            {
              printf '### Crash dump %s\n\n~~~\n' "$dump"
              sed -n '1,/^modules:$/p' "$report" | head -100
              printf '~~~\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore
