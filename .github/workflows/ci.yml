name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Harness download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-

      - name: Lint
        run: npm run lint

      - name: Chromium system dependencies
        run: npx playwright-core install-deps chromium

      - name: Integration tests with coverage, CPU profiles, and screenshots
        run: npm test

      - name: Hotspots
        if: always()
        run: cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore
