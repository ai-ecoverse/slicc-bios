name: CI

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: cloud-run-job
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: slicc-harness-cdn-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: slicc-harness-cdn-${{ runner.os }}-
      - name: Chrome
        run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps} --version 156.0.8078.80
      - name: One forced row
        env:
          SLICC_RECOVERY_DIAGNOSTIC: "1"
          GLOB: test/integration/cdp.test.mjs
          SHARDS: "1"
          TEST: >-
            node --test --test-concurrency=1 --test-timeout=900000 --test-name-pattern='^real slicc-extension 7\.10\.0: recovery scenario 7\.9\.16:' --test-global-setup=test/integration/global.mjs test/integration/cdp.test.mjs
          SLICC_TEST_FILES: test/integration/cdp.test.mjs
          SLICC_TEST_ALL: test/integration/cdp.test.mjs
          SLICC_TEST_SHARD: "0"
        run: |
          mkdir -p diagnostic
          export SLICC_TEST_JUNIT="$PWD/diagnostic/row.xml"
          export SLICC_TEST_NODE_OPTIONS=""
          export NODE_OPTIONS="--require $PWD/node_modules/@ai-ecoverse/slicc-shared-web/harness/shard.cjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=$PWD/diagnostic/row.xml"
          result=0
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' bash -eo pipefail -c "$TEST" 2>&1 | tee diagnostic/row.log || result=$?
          [ "$result" = 1 ]
          env -u NODE_OPTIONS node test/integration/verify-recovery-diagnostic.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-report-${{ github.run_attempt }}
          path: |
            diagnostic/
            artifacts/**/*.log
          if-no-files-found: error
