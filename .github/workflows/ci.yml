name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: recovery-a
            expected: 4
            pattern: '^real slicc-extension (7\.9\.16|7\.5\.1|7\.6\.2|7\.6\.3): a blocked protected hop'
          - group: recovery-b
            expected: 4
            pattern: '^real slicc-extension (7\.6\.4|7\.9\.13|7\.9\.5|7\.9\.4): a blocked protected hop'
          - group: legacy
            expected: 3
            pattern: '^real slicc-extension (7\.9\.13|7\.9\.5|7\.9\.4): playwright-cli opens about:blank'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: mkdir -p diagnostic-artifacts && timeout -k 30 900 npm ci
      - name: Build traced extension
        run: |
          git clone --branch v7.9.16 --single-branch https://github.com/ai-ecoverse/slicc-extension.git "$RUNNER_TEMP/diagnostic-extension-source"
          git -C "$RUNNER_TEMP/diagnostic-extension-source" apply "$GITHUB_WORKSPACE/test/integration/diagnostic-extension.patch"
          git -C "$RUNNER_TEMP/diagnostic-extension-source" apply "$GITHUB_WORKSPACE/test/integration/diagnostic-extension-candidate.patch"
          cp test/integration/diagnostic-extension.mjs "$RUNNER_TEMP/diagnostic-extension-source/extension/diagnostic.js"
          cd "$RUNNER_TEMP/diagnostic-extension-source"
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" extension-install "$PWD" timeout -k 30 900 npm ci
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" extension-seven "$PWD" timeout -k 30 900 node scripts/build-seven.mjs
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" extension-six "$PWD" timeout -k 30 900 node scripts/build-six.mjs
      - name: Build traced CLI
        if: always()
        run: |
          git clone --branch v1.42.10 --single-branch https://github.com/ai-ecoverse/slicc-cdp.git "$RUNNER_TEMP/diagnostic-cdp-source"
          git -C "$RUNNER_TEMP/diagnostic-cdp-source" apply "$GITHUB_WORKSPACE/test/integration/diagnostic-cli.patch"
          cp test/integration/diagnostic-cli.rs "$RUNNER_TEMP/diagnostic-cdp-source/crates/cdp-client/src/diagnostic.rs"
          rustup target add wasm32-wasip1
          cd "$RUNNER_TEMP/diagnostic-cdp-source"
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" cli "$PWD" timeout -k 30 900 cargo build --locked --release --target wasm32-wasip1 -p slicc-cdp -j 4
      - run: npx --no-install slicc-cdp install-browser
      - name: Protocol gates and security pins
        if: matrix.group == 'recovery-a'
        env:
          SLICC_CDP_PORTS: 9300-9309
          SLICC_DIAGNOSTIC_EXTENSION: ${{ runner.temp }}/diagnostic-extension-source/extension
        run: |
          timeout -k 30 900 node --test --test-concurrency=1 --test-timeout=60000 --test-reporter=junit --test-reporter-destination=diagnostic-artifacts/junit-gates.xml test/integration/diagnostic-fetch.test.mjs test/integration/diagnostic-output.test.mjs test/integration/guard-protected-navigation.test.mjs test/integration/guard-ordering-*.test.mjs test/integration/guard-lock-*.test.mjs test/integration/guard-forward-audit.test.mjs
      - name: Native BFCache security
        if: always() && matrix.group == 'recovery-a'
        env:
          SLICC_CDP_PORTS: 9300-9309
        run: |
          timeout -k 30 900 xvfb-run -a node --test --test-concurrency=1 --test-timeout=600000 --test-global-setup=test/integration/global.mjs --test-reporter=junit --test-reporter-destination=diagnostic-artifacts/junit-bfcache.xml test/integration/guard-bfcache.test.mjs test/integration/bfcache-extension.test.mjs
      - name: Production CLI control
        if: always() && matrix.group == 'recovery-a'
        env:
          SLICC_DIAGNOSTIC_ROLL_FORWARD: '1'
          SLICC_CDP_PORTS: 9300-9309
          SLICC_DIAGNOSTIC_EXTENSION: ${{ runner.temp }}/diagnostic-extension-source/extension
          SLICC_DIAGNOSTIC_DIR: diagnostic-artifacts/production-cli
          SLICC_DIAGNOSTIC_RELEASE_CLI: ${{ github.workspace }}/node_modules/@ai-ecoverse/slicc-cdp/bin/playwright-cli.wasm
        run: |
          mkdir -p diagnostic-artifacts/production-cli
          timeout -k 30 900 xvfb-run -a node --test --test-concurrency=1 --test-timeout=600000 --test-global-setup=test/integration/global.mjs --test-name-pattern="^real slicc-extension 7\.9\.16: a blocked protected hop" --test-reporter=junit --test-reporter-destination=diagnostic-artifacts/production-cli/junit-control.xml test/integration/cdp.test.mjs
          python3 -c 'import xml.etree.ElementTree as E; cases=list(E.parse("diagnostic-artifacts/production-cli/junit-control.xml").iter("testcase")); assert len(cases)==1; assert cases[0].find("failure") is None; print({"productionCliControl":1})'
      - name: Sequential roll-forward scenarios
        if: always()
        env:
          SLICC_DIAGNOSTIC_PATTERN: ${{ matrix.pattern }}
          SLICC_DIAGNOSTIC_EXPECTED: ${{ matrix.expected }}
          SLICC_DIAGNOSTIC_ROLL_FORWARD: '1'
          SLICC_CDP_PORTS: 9300-9309
          SLICC_DIAGNOSTIC_EXTENSION: ${{ runner.temp }}/diagnostic-extension-source/extension
          SLICC_DIAGNOSTIC_CLI: ${{ runner.temp }}/diagnostic-cdp-source/target/wasm32-wasip1/release/playwright-cli.wasm
          SLICC_DIAGNOSTIC_RELEASE_CLI: ${{ matrix.group == 'legacy' && format('{0}/node_modules/@ai-ecoverse/slicc-cdp/bin/playwright-cli.wasm', github.workspace) || '' }}
          SLICC_DIAGNOSTIC_DIR: diagnostic-artifacts
        run: |
          mkdir -p diagnostic-artifacts
          timeout -k 30 900 xvfb-run -a node --test --test-concurrency=1 --test-timeout=600000 --test-global-setup=test/integration/global.mjs --test-name-pattern="$SLICC_DIAGNOSTIC_PATTERN" --test-reporter=junit --test-reporter-destination=diagnostic-artifacts/junit-diagnostic.xml test/integration/cdp.test.mjs
          python3 -c 'import os, xml.etree.ElementTree as E; cases=list(E.parse("diagnostic-artifacts/junit-diagnostic.xml").iter("testcase")); assert len(cases)==int(os.environ["SLICC_DIAGNOSTIC_EXPECTED"]); assert all(c.find("failure") is None for c in cases); print({"scenarioCount":len(cases)})'
      - name: Native vault and hidden-world security
        if: always() && matrix.group == 'recovery-a'
        env:
          SLICC_CDP_PORTS: 9300-9309
        run: |
          timeout -k 30 900 xvfb-run -a node --test --test-concurrency=1 --test-timeout=600000 --test-global-setup=test/integration/global.mjs --test-name-pattern="^the guard keeps seven|^a browser extension’s hidden world|^on the link path, playwright-cli: a goto" --test-reporter=junit --test-reporter-destination=diagnostic-artifacts/junit-security.xml test/integration/cdp.test.mjs
          python3 -c 'import xml.etree.ElementTree as E; cases=list(E.parse("diagnostic-artifacts/junit-security.xml").iter("testcase")); assert len(cases)==4; assert all(c.find("failure") is None for c in cases); print({"nativeSecurityCount":len(cases)})'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-traces-${{ matrix.group }}
          path: |
            diagnostic-artifacts/**/*.jsonl
            diagnostic-artifacts/**/junit-*.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-cli-build-${{ matrix.group }}
          path: ${{ runner.temp }}/diagnostic-cdp-source/target/wasm32-wasip1/release/playwright-cli.wasm
          if-no-files-found: warn
