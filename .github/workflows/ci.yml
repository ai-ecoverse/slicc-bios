name: Diagnostic only

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLICC_CDP_PORTS: 9300-9309
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run pretest
      - name: One recovery row
        run: node --test --test-concurrency=1 --test-timeout=600000 --test-global-setup=test/integration/global.mjs test/integration/recovery-diagnostic.test.mjs > diagnostic.log 2>&1
      - name: Text evidence
        if: always()
        run: grep -E 'DIAGNOSTIC_|not ok|error:|failureType:|Error' diagnostic.log | cut -c 1-1800 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-text
          path: diagnostic.log
          retention-days: 3
