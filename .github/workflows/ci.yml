name: Diagnostic only

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft
    runs-on: cloud-run-job
    timeout-minutes: 60
    env:
      CI: 'true'
      SLICC_CDP_PORTS: 9300-9309
      SLICC_HEADLESS: '0'
      TEST_GLOB: test/integration/cdp.test.mjs
      SHARDS: '1'
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps}
      - name: Display
        run: |
          if ! command -v Xvfb > /dev/null; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb
            else sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; fi
          fi
      - name: Paired rows
        run: |
          mkdir -p diagnostic
          node -e 'const os=require("node:os"); console.log(JSON.stringify({at:Date.now(),cores:os.availableParallelism(),load:os.loadavg(),memory:os.totalmem()}))' > diagnostic/runner.json
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); if(!p.scripts.test.endsWith(process.env.TEST_GLOB)||process.env.SHARDS!=="1") throw new Error("diagnostic selection differs");'
          status=0
          for pass in 1 2 3; do
            result=0
            PAIRED_REPEAT="$pass" xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' timeout -k 30 900 npm test || result=$?
            node test/integration/paired-evidence.mjs "$pass"
            if [ "$result" != 0 ]; then status=1; fi
            if node -e 'process.exit(require("./diagnostic/"+process.argv[1]+".summary.json").stop?0:1)' "$pass"; then break; fi
          done
          exit "$status"
      - name: Text evidence
        if: always()
        run: |
          mkdir -p diagnostic
          node -e 'const fs=require("node:fs"); for(const name of fs.readdirSync("diagnostic").filter(n=>n.endsWith(".summary.json"))){const s=JSON.parse(fs.readFileSync("diagnostic/"+name,"utf8"));console.log(JSON.stringify({name,counts:s.counts,failures:s.failures,retryRefusals:s.retryRefusals,stop:s.stop}));}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paired-recovery-text
          path: |
            diagnostic/*.json
            diagnostic/*.jsonl
            diagnostic/*.xml
          retention-days: 3
