name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: mkdir -p diagnostic-artifacts && timeout -k 30 900 npm ci
      - name: Build traced extension
        run: |
          git clone --branch v7.9.16 --single-branch https://github.com/ai-ecoverse/slicc-extension.git "$RUNNER_TEMP/diagnostic-extension-source"
          git -C "$RUNNER_TEMP/diagnostic-extension-source" apply "$GITHUB_WORKSPACE/test/integration/diagnostic-extension.patch"
          cp test/integration/diagnostic-extension.mjs "$RUNNER_TEMP/diagnostic-extension-source/extension/diagnostic.js"
          cd "$RUNNER_TEMP/diagnostic-extension-source"
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" extension-install "$PWD" timeout -k 30 900 npm ci
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" extension-seven "$PWD" timeout -k 30 900 node scripts/build-seven.mjs
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" extension-six "$PWD" timeout -k 30 900 node scripts/build-six.mjs
      - name: Build traced CLI
        if: always()
        run: |
          git clone --branch v1.42.10 --single-branch https://github.com/ai-ecoverse/slicc-cdp.git "$RUNNER_TEMP/diagnostic-cdp-source"
          git -C "$RUNNER_TEMP/diagnostic-cdp-source" apply "$GITHUB_WORKSPACE/test/integration/diagnostic-cli.patch"
          cp test/integration/diagnostic-cli.rs "$RUNNER_TEMP/diagnostic-cdp-source/crates/cdp-client/src/diagnostic.rs"
          rustup target add wasm32-wasip1
          cd "$RUNNER_TEMP/diagnostic-cdp-source"
          node "$GITHUB_WORKSPACE/test/integration/diagnostic-build.mjs" cli "$PWD" timeout -k 30 900 cargo build --locked --release --target wasm32-wasip1 -p slicc-cdp -j 4
      - run: npx --no-install slicc-cdp install-browser
      - name: Eleven diagnostic rows
        env:
          SLICC_DIAGNOSTIC_EXTENSION: ${{ runner.temp }}/diagnostic-extension-source/extension
          SLICC_DIAGNOSTIC_CLI: ${{ runner.temp }}/diagnostic-cdp-source/target/wasm32-wasip1/release/playwright-cli.wasm
          SLICC_DIAGNOSTIC_DIR: diagnostic-artifacts
        run: |
          mkdir -p diagnostic-artifacts
          timeout -k 30 900 xvfb-run -a node --test --test-concurrency=1 --test-timeout=600000 --test-global-setup=test/integration/global.mjs --test-name-pattern="^real slicc-extension (7\.9\.16|7\.5\.1|7\.6\.2|7\.6\.3|7\.6\.4|7\.9\.13|7\.9\.5|7\.9\.4): (a blocked protected hop|playwright-cli opens about:blank)" --test-reporter=junit --test-reporter-destination=diagnostic-artifacts/junit-diagnostic.xml test/integration/cdp.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-traces
          path: |
            diagnostic-artifacts/*.jsonl
            diagnostic-artifacts/junit-*.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-cli-build
          path: ${{ runner.temp }}/diagnostic-cdp-source/target/wasm32-wasip1/release/playwright-cli.wasm
          if-no-files-found: warn
