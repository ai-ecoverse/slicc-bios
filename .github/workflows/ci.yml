name: CI
on:
  workflow_dispatch:
  push:
    branches: [bb/proof-*]
permissions:
  contents: read
env:
  SLICC_CDP_PORTS: '9300-9309'
jobs:
  integration:
    name: proof (${{ matrix.copy }})
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (contains(fromJSON('["push","schedule","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {"copy": [1]}
    env:
      LEFTHOOK: '0'
      SLICC_NO_UPDATE_CHECK: '1'
      SLICC_CLI: ${{ github.workspace }}/node_modules/.bin/slicc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-
      - run: if sudo -n true 2>/dev/null; then npx playwright-core install-deps chromium; fi
      - run: npm run pretest
      - name: Proof rounds
        env:
          SLICC_TESTS: test/integration/sw-nodebug.test.mjs
          SLICC_PATTERN: "no debugger pause on workers"
        run: |
          pass=0
          for i in $(seq 1); do
            if node --test --test-concurrency=1 --test-timeout=900000 --test-global-setup=test/integration/global.mjs ${SLICC_PATTERN:+--test-name-pattern="$SLICC_PATTERN"} $SLICC_TESTS > "$RUNNER_TEMP/round-$i.log" 2>&1; then pass=$((pass+1)); echo "round $i: PASS"; else echo "round $i: FAIL"; grep -v '^\s*$' "$RUNNER_TEMP/round-$i.log" | grep -A40 'failing tests' | head -80; fi
            grep -h '^probe' "$RUNNER_TEMP/round-$i.log" | head -200 || true
            mkdir -p "artifacts-proof/round-$i"; mv artifacts "artifacts-proof/round-$i/" 2>/dev/null || true; cp "$RUNNER_TEMP/round-$i.log" "artifacts-proof/round-$i/"
          done
          echo "proof copy ${{ matrix.copy }}: $pass/1 passed"
          test "$pass" = 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: proof-${{ matrix.copy }}
          include-hidden-files: true
          path: artifacts-proof/
          if-no-files-found: ignore
