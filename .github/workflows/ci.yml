name: CI
on:
  workflow_dispatch:
  push:
    branches: [bb/proof-971-*]
permissions:
  contents: read
env:
  SLICC_CDP_PORTS: '9300-9309'
jobs:
  integration:
    name: proof (${{ matrix.mode }} ${{ matrix.copy }})
    runs-on: cloud-run-job
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [free, loaded]
        copy: [1, 2, 3]
    env:
      LEFTHOOK: '0'
      SLICC_NO_UPDATE_CHECK: '1'
      SLICC_CLI: ${{ github.workspace }}/node_modules/.bin/slicc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-
      - run: if sudo -n true 2>/dev/null; then npx playwright-core install-deps chromium; fi
      - run: npm run pretest
      - name: Proof rounds
        env:
          SLICC_TESTS: test/integration/cdp.test.mjs
          SLICC_PATTERN: takes over slicc-node
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = loaded ]; then export PROOF_PIN=0 PROOF_HOGS=1; fi
          echo "nproc $(nproc)"
          if [ -z "${DISPLAY:-}" ]; then
            command -v Xvfb >/dev/null || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq xvfb; }
            nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            sleep 2
            export DISPLAY=:99
          fi
          pass=0
          for i in $(seq 15); do
            if node --test --test-concurrency=1 --test-timeout=900000 --test-global-setup=test/integration/global.mjs --test-name-pattern="$SLICC_PATTERN" $SLICC_TESTS > "$RUNNER_TEMP/round-$i.log" 2>&1; then pass=$((pass+1)); echo "round $i: PASS"; else echo "round $i: FAIL"; grep -v '^\s*$' "$RUNNER_TEMP/round-$i.log" | grep -A40 'failing tests' | head -60; fi
            grep -h -E '^probe' "$RUNNER_TEMP/round-$i.log" | head -80 || true
            mkdir -p "artifacts-proof/round-$i"; mv artifacts "artifacts-proof/round-$i/" 2>/dev/null || true; cp "$RUNNER_TEMP/round-$i.log" "artifacts-proof/round-$i/"
          done
          echo "proof ${{ matrix.mode }} ${{ matrix.copy }}: $pass/15 passed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: proof-${{ matrix.mode }}-${{ matrix.copy }}
          include-hidden-files: true
          path: artifacts-proof/
          if-no-files-found: ignore
