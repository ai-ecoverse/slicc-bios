name: Candidate diagnostic

on:
  push:
    branches:
      - diagnostic/cdp-675-stage1-thr_uzh6iuph2q
    paths:
      - .github/workflows/cdp-675-stage1.yml
      - test/integration/cdp-675-*.test.mjs
      - test/integration/fixtures/cdp-675-*

permissions:
  contents: read

concurrency:
  group: candidate-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    if: ${{ contains(github.event.head_commit.message, 'run-candidates') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLICC_CDP_PORTS: 9300-9309
      SLICC_675_STAGE1_DIAGNOSTIC: '1'
      SLICC_675_RUN: '50'
      SLICC_694_REQUIRE_SAME_ORIGIN_CHILD: '1'
      UV_THREADPOOL_SIZE: '2'
      CARGO_BUILD_JOBS: '4'
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Fetch frozen bios comparison source
        run: |
          set -eu
          checkout=$(git rev-parse HEAD)
          git fetch --no-tags origin 8863575921d1c05f7b3aaa8b9ebc215e89301a0b
          test "$(git rev-parse FETCH_HEAD)" = 8863575921d1c05f7b3aaa8b9ebc215e89301a0b
          test "$(git rev-parse HEAD)" = "$checkout"
      - uses: actions/checkout@v4
        with:
          repository: ai-ecoverse/slicc-cdp
          ref: 67f017c4eacb5e4125810b6221b446f3ad6153e4
          path: candidates/cdp
      - uses: actions/checkout@v4
        with:
          repository: ai-ecoverse/mcpcat
          ref: 7d1e7755d6e149eac222c684e59b1d475f120022
          path: candidates/mcpcat
      - uses: actions/checkout@v4
        with:
          repository: ai-ecoverse/slicc-cli
          ref: 3f902e7225bf25f56b45ef65d1b4c4cd2ea8064c
          path: candidates/cli
      - uses: actions/checkout@v4
        with:
          repository: ai-ecoverse/slicc-extension
          ref: 3f8443f081e366c1d00b74160d149d389287b2f3
          path: candidates/extension
      - uses: actions/checkout@v4
        with:
          repository: ai-ecoverse/slicc-browsers
          ref: 306688a47f09097d027a4e7cbb0513f9c7c52a16
          path: candidates/browsers
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: npm ci
      - name: Acquire and verify released components
        run: |
          set -eu
          artifacts="$RUNNER_TEMP/candidate-artifacts"
          mkdir -p "$artifacts" "$RUNNER_TEMP/candidate-trace"
          npm install --prefix "$RUNNER_TEMP/old-cli" --no-audit --no-fund @ai-ecoverse/slicc@1.49.36
          "$RUNNER_TEMP/old-cli/node_modules/.bin/slicc" --version > "$RUNNER_TEMP/candidate-trace/old-cli-version.txt"
          npm pack @ai-ecoverse/slicc-cdp@1.45.0 @ai-ecoverse/mcpcat@0.31.17 @ai-ecoverse/slicc-browsers@1.19.0 @ai-ecoverse/slicc-cdp@1.43.1 --ignore-scripts --pack-destination "$artifacts"
          npm view @ai-ecoverse/slicc-cdp@1.45.0 name version dist gitHead --json > "$artifacts/cdp.registry.json"
          npm view @ai-ecoverse/mcpcat@0.31.17 name version dist gitHead --json > "$artifacts/mcpcat.registry.json"
          npm view @ai-ecoverse/slicc-browsers@1.19.0 name version dist gitHead --json > "$artifacts/browsers.registry.json"
          npm view @ai-ecoverse/slicc-cdp@1.43.1 name version dist gitHead --json > "$artifacts/oldClient.registry.json"
          cp test/integration/fixtures/cdp-694/slicc-extension-7.12.1-e7a26846.zip "$artifacts/slicc-extension.zip"
          echo "e7a268465136181790468488e559e9cc3a9322d8f4d3a407580a8c452b6d044d  $artifacts/slicc-extension.zip" | sha256sum -c -
          curl -fL --retry 2 --max-time 120 https://github.com/ai-ecoverse/slicc-cli/releases/download/v1.60.0/slicc-linux-amd64 -o "$artifacts/slicc-linux-amd64"
          echo "46b22657eb475da89e5fdcc0197923dfcfb80a38c01ec6093966f2a4585b17df  $artifacts/slicc-linux-amd64" | sha256sum -c -
          chmod +x "$artifacts/slicc-linux-amd64"
          "$artifacts/slicc-linux-amd64" --version > "$RUNNER_TEMP/candidate-trace/cli-version.txt"
          sha256sum "$artifacts/slicc-linux-amd64" > "$RUNNER_TEMP/candidate-trace/cli.sha256"
          sha256sum "$artifacts/slicc-extension.zip" > "$RUNNER_TEMP/candidate-trace/extension.sha256"
          mkdir -p "$RUNNER_TEMP/extension-candidate" "$artifacts/browsers-release"
          unzip -q "$artifacts/slicc-extension.zip" -d "$RUNNER_TEMP/extension-candidate"
          tar -xzf "$artifacts/ai-ecoverse-slicc-browsers-1.19.0.tgz" --strip-components=1 -C "$artifacts/browsers-release"
          cp test/integration/fixtures/cdp-675-bfcache-restore.mjs "$artifacts/browsers-release/bfcache-restore.mjs"
          echo "6e9439a236b47ccd8479d0b222ff2c5139ae2cc9a512732ccab14071b5751248  $artifacts/browsers-release/bfcache-restore.mjs" | sha256sum -c -
          node test/integration/fixtures/cdp-675-artifacts.mjs "$artifacts"
          cp "$artifacts/manifest.json" "$RUNNER_TEMP/candidate-trace/manifest.json"
          cd candidates/cdp
          cargo test --locked -p slicc-cdp-client one_second_settling_reply --lib -- --test-threads=1 > "$RUNNER_TEMP/candidate-trace/rust-budget.log" 2>&1
          cargo test --locked -p slicc-cdp-client plain_fallback_retry --lib -- --test-threads=1 > "$RUNNER_TEMP/candidate-trace/rust-plain-retry.log" 2>&1
          cd ../..
          npx --no-install slicc-cdp install-browser
      - name: Run candidate diagnostic
        run: |
          set +e
          export SLICC_PROOF_TRACE_DIR="$RUNNER_TEMP/candidate-trace"
          export SLICC_675_ARTIFACT_DIR="$RUNNER_TEMP/candidate-artifacts"
          export SLICC_675_EXTENSION_DIR="$RUNNER_TEMP/extension-candidate"
          export SLICC_CLI="$RUNNER_TEMP/candidate-artifacts/slicc-linux-amd64"
          export SLICC_675_OLD_CLI="$RUNNER_TEMP/old-cli/node_modules/.bin/slicc"
          timeout -k 30 2700 node --test --test-force-exit --test-concurrency=1 --test-timeout=900000 --test-global-setup=test/integration/global.mjs test/integration/cdp-675-packaged.test.mjs test/integration/cdp-675-existing-reads.test.mjs > "$RUNNER_TEMP/candidate.log" 2>&1
          result=$?
          echo "Diagnostic exit: $result"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-trace
          path: |
            ${{ runner.temp }}/candidate-trace
            ${{ runner.temp }}/candidate-artifacts
            ${{ runner.temp }}/candidate.log
          if-no-files-found: error
          retention-days: 3
