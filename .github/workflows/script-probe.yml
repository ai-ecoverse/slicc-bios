name: Script probe

on:
  push:
    branches: [guard-cli14918-head, guard-cli14918-main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: cloud-run-job
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - copy: '1'
            cpu: '0'
          - copy: '2'
            cpu: '0'
          - copy: '3'
            cpu: '0'
          - copy: '4'
            cpu: '1'
          - copy: '5'
            cpu: '1'
          - copy: '6'
            cpu: '1'
    env:
      LEFTHOOK: '0'
      SLICC_COVERAGE: '0'
      PROBE_COPY: ${{ matrix.copy }}
      PROBE_CPU: ${{ matrix.cpu }}
      PROBE_BASE: ba68dfbdd570982bcc98c3a2c865f8275a0b2a31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Chrome
        run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --no-install slicc-cdp install-browser ${DEPS:+--with-deps}
      - name: Measure
        run: |
          set -o pipefail
          if [ -z "${DISPLAY:-}" ]; then
            if ! command -v Xvfb > /dev/null; then
              if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb
              elif sudo -n true 2>/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
              else echo "::error title=Display::No Xvfb on $RUNNER_NAME and no root to install it: add xvfb to the runner image"; exit 1
              fi
            fi
            nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
            export DISPLAY=:99
          fi
          node --test --test-concurrency=1 --test-timeout=2700000 --test-global-setup=test/integration/global.mjs test/integration/guard-script-probe.test.mjs 2>&1 | tee script-probe.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: script-probe-${{ matrix.copy }}
          path: |
            artifacts/script-probe-${{ matrix.copy }}/
            script-probe.log
          if-no-files-found: error
