name: Canary

on:
  workflow_dispatch:
    inputs:
      overrides:
        description: 'Candidate versions, a JSON list of name@version: ["@ai-ecoverse/slicc-kernel@1.81.0"]'
        type: string
        default: '[]'
      runner:
        description: 'Runner label for the shards, ignored on fork PRs and on dispatches from other branches; empty means vars.CERT_RUNNER, then ubuntu-latest'
        type: string
        default: ''
      expect:
        description: 'Regressions that must show up, a JSON list of {test, log} substrings (a negative proof)'
        type: string
        default: ''
      bios-ref:
        description: 'slicc-bios ref to test; empty means the commit of this canary.yml'
        type: string
        default: ''
      shards:
        description: 'Shards from scripts/canary/shards.json, a JSON list; empty means ci.yml''s'
        type: string
        default: ''
      candidate-package:
        description: 'The package an npm-packed candidate replaces, e.g. @ai-ecoverse/slicc-cdp'
        type: string
        default: ''
      candidate-artifact:
        description: 'The artifact holding the npm pack tarball'
        type: string
        default: ''
      candidate-run:
        description: 'The run id that uploaded the artifact'
        type: string
        default: ''
      candidate-sha256:
        description: 'The tarball''s sha256; anything else is refused'
        type: string
        default: ''
      candidate-repo:
        description: 'The repository of that run; empty means this one'
        type: string
        default: ''
      candidate-artifact-id:
        description: 'The artifact''s id, the artifact-id output of the step that uploaded it'
        type: string
        default: ''
      candidate-artifact-digest:
        description: 'The artifact''s zip digest, the artifact-digest output of that step: 64 hex digits, a sha256: prefix is allowed'
        type: string
        default: ''
      candidate-binding:
        description: 'strict (empty) refuses a candidate without its artifact id and digest; legacy accepts one bound by name only'
        type: string
        default: ''
      repeat:
        description: 'Run each selected test this many times (1 to 10)'
        type: string
        default: '1'
      label:
        description: 'A prefix for every artifact name, so two canaries in one run do not collide'
        type: string
        default: ''
  workflow_call:
    inputs:
      overrides:
        type: string
        required: false
        default: '[]'
      runner:
        type: string
        required: false
        default: ''
      expect:
        type: string
        required: false
        default: ''
      bios-ref:
        type: string
        required: false
        default: ''
      shards:
        type: string
        required: false
        default: ''
      candidate-package:
        type: string
        required: false
        default: ''
      candidate-artifact:
        type: string
        required: false
        default: ''
      candidate-run:
        type: string
        required: false
        default: ''
      candidate-sha256:
        type: string
        required: false
        default: ''
      candidate-repo:
        type: string
        required: false
        default: ''
      candidate-artifact-id:
        type: string
        required: false
        default: ''
      candidate-artifact-digest:
        type: string
        required: false
        default: ''
      candidate-binding:
        type: string
        required: false
        default: ''
      repeat:
        type: number
        required: false
        default: 1
      label:
        type: string
        required: false
        default: ''
    outputs:
      ok:
        description: 'true when the canary is green'
        value: ${{ jobs.report.outputs.ok }}
      result:
        description: 'The JSON summary: ok, counts, regressions, both, flaky, failures, missingShards, candidates, ambiguous, tests (every row as {shard, key, test, verdict, failed}, failed counting completed runs), and the canary artifact''s name and url; a summary over 512 KB is a FAIL verdict instead'
        value: ${{ jobs.report.outputs.result }}
      artifact-id:
        description: 'The canary artifact''s id, the artifact-id output of the report job''s upload step'
        value: ${{ jobs.report.outputs.artifact-id }}
      artifact-digest:
        description: 'The canary artifact''s zip SHA-256 from that upload step: 64 lowercase hex digits; the REST API''s digest is sha256: and the same digits'
        value: ${{ jobs.report.outputs.artifact-digest }}
      artifacts:
        description: 'A JSON list of {role, name, id, digest, attempt} for every artifact this call uploaded (role plan, shard, files or report), each id and digest from its own upload step'
        value: ${{ jobs.report.outputs.artifacts }}
  schedule:
    - cron: '23 * * * *'
  pull_request:
    paths:
      - .github/workflows/canary.yml
      - scripts/canary/**
      - test/integration/sweep.test.mjs
      - test/integration/canary.test.mjs
      - test/integration/pins.test.mjs

permissions:
  contents: read
  actions: read

env:
  SLICC_CDP_PORTS: '9300-9309'

concurrency:
  group: canary-${{ (!startsWith(github.workflow_ref, 'ai-ecoverse/slicc-bios/.github/workflows/canary.yml@') && format('call-{0}-{1}-{2}-{3}', github.run_id, inputs.label, inputs.candidate-sha256, inputs.overrides)) || (github.event_name == 'pull_request' && github.ref) || (github.event_name == 'schedule' && 'schedule') || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.workflow_ref, 'ai-ecoverse/slicc-bios/.github/workflows/canary.yml@') && github.event_name == 'pull_request' }}

jobs:
  plan:
    name: canary / plan
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      runs: ${{ steps.decide.outputs.runs }}
      jobs: ${{ steps.decide.outputs.jobs }}
      key: ${{ steps.plan.outputs.key }}
      uploads: ${{ steps.plan.outputs.uploads }}
      cli: ${{ steps.cli.outputs.version }}
      prefix: ${{ steps.plan.outputs.prefix }}
      refused: ${{ steps.plan.outputs.refused }}
      attempt: ${{ github.run_attempt }}
      inputs-id: ${{ steps.inputs.outputs.artifact-id }}
      inputs-digest: ${{ steps.inputs.outputs.artifact-digest }}
      proof-id: ${{ steps.proof.outputs.artifact-id }}
      proof-digest: ${{ steps.proof.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ai-ecoverse/slicc-bios
          ref: ${{ job.workflow_sha }}

      - id: ref
        name: The canary's tools are this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ -z "$WORKFLOW_SHA" ] || [ "$sha" != "$WORKFLOW_SHA" ]; then
            echo "canary tools: FAIL checked out $sha, not the workflow's own commit ${WORKFLOW_SHA:-(none)}"
            exit 1
          fi
          echo "canary tools: PASS $sha, the commit of $WORKFLOW_REF"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - id: cli
        name: The slicc CLI main pins
        run: echo "version=$(node -p "require('./package.json').devDependencies['@ai-ecoverse/slicc']")" >> "$GITHUB_OUTPUT"

      - id: plan
        name: What to test
        env:
          EVENT: ${{ startsWith(github.workflow_ref, 'ai-ecoverse/slicc-bios/.github/workflows/canary.yml@') && github.event_name || 'workflow_call' }}
          OVERRIDES: ${{ inputs.overrides }}
          CANDIDATE_PACKAGE: ${{ inputs.candidate-package }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
          CANDIDATE_RUN: ${{ inputs.candidate-run }}
          CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
          CANDIDATE_REPO: ${{ inputs.candidate-repo }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate-artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate-artifact-digest }}
          CANDIDATE_BINDING: ${{ inputs.candidate-binding }}
          REPEAT: ${{ inputs.repeat }}
          LABEL: ${{ inputs.label }}
          EXPECT: ${{ inputs.expect }}
          SHARDS: ${{ inputs.shards }}
          BIOS_REF: ${{ inputs.bios-ref }}
          TOOLS_SHA: ${{ steps.ref.outputs.sha }}
        run: node scripts/canary/plan.mjs

      - id: seen
        name: The last scheduled canary's inputs
        if: github.event_name == 'schedule' && steps.plan.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: canary-inputs.json
          key: ${{ steps.plan.outputs.key }}
          lookup-only: true

      - id: decide
        name: Run only when something changed
        env:
          RUNS: ${{ steps.plan.outputs.runs }}
          JOBS: ${{ steps.plan.outputs.jobs }}
          SEEN: ${{ steps.seen.outputs.cache-hit }}
        run: |
          if [ "$SEEN" = true ]; then
            printf 'runs=[]\njobs=[]\n' >> "$GITHUB_OUTPUT"
            echo 'Nothing new on npm since the last canary.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'runs=%s\njobs=%s\n' "$RUNS" "$JOBS" >> "$GITHUB_OUTPUT"
          fi

      - id: inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'schedule'
        with:
          name: ${{ steps.plan.outputs.prefix }}canary-inputs
          path: canary-inputs.json

      - id: proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: fromJSON(steps.plan.outputs.uploads || '[]')[0]
        with:
          name: ${{ fromJSON(steps.plan.outputs.uploads)[0].name }}
          path: ${{ fromJSON(steps.plan.outputs.uploads)[0].path }}

  shard:
    name: canary / ${{ matrix.job.run }} (${{ matrix.job.shard }})
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ${{ (startsWith(github.workflow_ref, 'ai-ecoverse/slicc-bios/.github/workflows/canary.yml@') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && (inputs.runner || vars.CERT_RUNNER)) || 'ubuntu-latest' }}
    timeout-minutes: 180
    outputs:
      binding_0: ${{ steps.bind.outputs.binding_0 }}
      binding_1: ${{ steps.bind.outputs.binding_1 }}
      binding_2: ${{ steps.bind.outputs.binding_2 }}
      binding_3: ${{ steps.bind.outputs.binding_3 }}
      binding_4: ${{ steps.bind.outputs.binding_4 }}
      binding_5: ${{ steps.bind.outputs.binding_5 }}
      binding_6: ${{ steps.bind.outputs.binding_6 }}
      binding_7: ${{ steps.bind.outputs.binding_7 }}
      binding_8: ${{ steps.bind.outputs.binding_8 }}
      binding_9: ${{ steps.bind.outputs.binding_9 }}
      binding_10: ${{ steps.bind.outputs.binding_10 }}
      binding_11: ${{ steps.bind.outputs.binding_11 }}
      binding_12: ${{ steps.bind.outputs.binding_12 }}
      binding_13: ${{ steps.bind.outputs.binding_13 }}
      binding_14: ${{ steps.bind.outputs.binding_14 }}
      binding_15: ${{ steps.bind.outputs.binding_15 }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      LEFTHOOK: '0'
      SLICC_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ai-ecoverse/slicc-bios
          ref: ${{ matrix.job.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.job.ref != job.workflow_sha
        with:
          persist-credentials: false
          repository: ai-ecoverse/slicc-bios
          ref: ${{ job.workflow_sha }}
          path: .canary-tools

      - name: The canary's scripts and sweep on the tested ref
        if: matrix.job.ref != job.workflow_sha
        run: |
          rm -rf scripts/canary
          mkdir -p scripts
          cp -R .canary-tools/scripts/canary scripts/canary
          test -e test/integration/sweep.test.mjs || cp .canary-tools/test/integration/sweep.test.mjs test/integration/
          rm -rf .canary-tools

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm

      - id: candidate
        name: The candidate artifact's id, name, repository, run and digest, before it is downloaded
        if: matrix.job.candidate
        env:
          CANDIDATE: ${{ toJSON(matrix.job.candidate) }}
          PREFIX: ${{ needs.plan.outputs.prefix }}
          UPLOADS: ${{ needs.plan.outputs.uploads }}
          PROOF_ID: ${{ needs.plan.outputs.proof-id }}
          PROOF_DIGEST: ${{ needs.plan.outputs.proof-digest }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/canary/bind.mjs candidate

      - name: The candidate artifact
        if: matrix.job.candidate && (steps.candidate.outputs.id != '' || steps.candidate.outputs.name != '')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          name: ${{ steps.candidate.outputs.name }}
          run-id: ${{ matrix.job.candidate.run }}
          repository: ${{ matrix.job.candidate.repo }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: .canary-candidate

      - run: npm ci

      - name: Harness download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/slicc-harness/cdn
          key: harness-cdn-${{ hashFiles('src/packages/**/pnpm-lock.yaml', 'src/packages/**/package.json') }}
          restore-keys: harness-cdn-

      - name: The slicc CLI, the link's reference peer
        env:
          CLI_VERSION: ${{ needs.plan.outputs.cli }}
        run: |
          if [ -x node_modules/.bin/slicc ]; then
            echo "SLICC_CLI=$PWD/node_modules/.bin/slicc" >> "$GITHUB_ENV"
          else
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/slicc-cli" "@ai-ecoverse/slicc@$CLI_VERSION"
            echo "SLICC_CLI=$RUNNER_TEMP/slicc-cli/node_modules/.bin/slicc" >> "$GITHUB_ENV"
          fi

      - name: Chromium
        run: |
          if sudo -n true 2>/dev/null; then
            npx playwright-core install-deps chromium
          else
            echo "No root on $RUNNER_NAME: the image's system libraries and fonts serve Chromium."
          fi
          npx playwright-core install --no-shell chromium

      - name: The shard with the overrides, then main's pins for what failed
        env:
          OVERRIDES: ${{ toJSON(matrix.job.overrides) }}
          CANDIDATE: ${{ toJSON(matrix.job.candidate) }}
          REPEAT: ${{ matrix.job.repeat }}
          SHARD: ${{ matrix.job.shard }}
          OUT: canary/${{ matrix.job.run }}-${{ matrix.job.shard }}
        run: node scripts/canary/shard.mjs --shard "$SHARD" --overrides "$OVERRIDES" --candidate "$CANDIDATE" --repeat "$REPEAT" --out "$OUT"

      - id: shard-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ needs.plan.outputs.prefix }}canary-shard-${{ matrix.job.run }}-${{ matrix.job.shard }}
          path: canary/${{ matrix.job.run }}-${{ matrix.job.shard }}/
          if-no-files-found: ignore

      - id: files-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ needs.plan.outputs.prefix }}canary-files-${{ matrix.job.run }}-${{ matrix.job.shard }}
          path: artifacts/
          if-no-files-found: ignore

      - id: bind
        name: This shard's artifacts as their upload steps returned them
        if: always()
        env:
          INDEX: ${{ strategy.job-index }}
          RUN: ${{ matrix.job.run }}
          SHARD: ${{ matrix.job.shard }}
          PREFIX: ${{ needs.plan.outputs.prefix }}
          ATTEMPT: ${{ github.run_attempt }}
          SHARD_ID: ${{ steps.shard-upload.outputs.artifact-id }}
          SHARD_DIGEST: ${{ steps.shard-upload.outputs.artifact-digest }}
          FILES_ID: ${{ steps.files-upload.outputs.artifact-id }}
          FILES_DIGEST: ${{ steps.files-upload.outputs.artifact-digest }}
        run: node scripts/canary/bind.mjs shard

  report:
    name: canary / report
    needs: [plan, shard]
    if: ${{ !cancelled() && needs.plan.outputs.jobs != '[]' }}
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.report.outputs.ok }}
      result: ${{ steps.result.outputs.result }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifacts: ${{ steps.manifest.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ai-ecoverse/slicc-bios
          ref: ${{ job.workflow_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - id: bind
        name: Each planned shard's artifacts, checked against their upload steps' ids and digests before the shard's is downloaded
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          BINDINGS: ${{ toJSON(needs.shard.outputs) }}
          PREFIX: ${{ needs.plan.outputs.prefix }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/canary/bind.mjs shards --out bindings.json --dir shards

      - id: download
        if: steps.bind.outputs.ids != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.bind.outputs.ids }}
          digest-mismatch: error
          path: ${{ steps.bind.outputs.path }}

      - id: report
        name: canary.json and the summary
        if: ${{ !cancelled() }}
        env:
          RUNS: ${{ needs.plan.outputs.runs }}
          CANARY_RUNNER: ${{ (startsWith(github.workflow_ref, 'ai-ecoverse/slicc-bios/.github/workflows/canary.yml@') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && (inputs.runner || vars.CERT_RUNNER)) || 'ubuntu-latest' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWNLOAD: ${{ steps.download.outcome }}
          PLAN_REFUSED: ${{ needs.plan.outputs.refused }}
        run: node scripts/canary/report.mjs --dir shards --runs "$RUNS" --out canary --bindings bindings.json --download "$DOWNLOAD"

      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: ${{ needs.plan.outputs.prefix }}canary
          path: canary/
          if-no-files-found: ignore

      - id: result
        name: The machine-readable result
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_NAME: ${{ needs.plan.outputs.prefix }}canary
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          node -e '
            const { readFileSync, appendFileSync } = require("node:fs");
            const result = JSON.parse(readFileSync("canary/result.json", "utf8"));
            if (typeof result.ok !== "boolean" || !/^canary\b.*: (PASS|FAIL)\b/.test(result.verdict ?? "")) {
              console.error("canary: FAIL the report wrote no verdict");
              process.exit(1);
            }
            result.artifact = {
              name: process.env.ARTIFACT_NAME,
              url: process.env.ARTIFACT_URL || "",
              id: process.env.ARTIFACT_ID || "",
              digest: process.env.ARTIFACT_DIGEST || "",
            };
            const output = `result=${JSON.stringify(result)}\n`;
            const bytes = Buffer.byteLength(output);
            if (bytes > 524288) {
              console.log(`canary: FAIL the result is ${bytes} bytes with its artifact, over the 524288-byte bound for a job output`);
              process.exit(1);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, output);
            console.log(result.verdict);
          '

      - id: manifest
        name: Every artifact this call uploaded, with the id and digest its upload step returned
        if: ${{ !cancelled() }}
        env:
          PREFIX: ${{ needs.plan.outputs.prefix }}
          UPLOADS: ${{ needs.plan.outputs.uploads }}
          PLAN_ATTEMPT: ${{ needs.plan.outputs.attempt }}
          INPUTS_ID: ${{ needs.plan.outputs.inputs-id }}
          INPUTS_DIGEST: ${{ needs.plan.outputs.inputs-digest }}
          PROOF_ID: ${{ needs.plan.outputs.proof-id }}
          PROOF_DIGEST: ${{ needs.plan.outputs.proof-digest }}
          REPORT_ID: ${{ steps.upload.outputs.artifact-id }}
          REPORT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/canary/bind.mjs manifest --bindings bindings.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ !cancelled() && github.event_name == 'schedule' && needs.plan.outputs.inputs-id != '' }}
        with:
          artifact-ids: ${{ needs.plan.outputs.inputs-id }}
          digest-mismatch: error
          path: .

      - name: Remember these inputs
        if: ${{ !cancelled() && github.event_name == 'schedule' && needs.plan.outputs.key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: canary-inputs.json
          key: ${{ needs.plan.outputs.key }}
