name: Preview

on:
  push:
    branches: ['bb/**']

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Publish the branch through sliccy.ai with its OIDC token
        run: node edge/publish.mjs "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
